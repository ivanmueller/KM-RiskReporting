# Developer convenience for `alembic` CLI commands (e.g. `alembic history`).
# The database URL is deliberately NOT set here: env.py resolves it from riskparse
# configuration (RISKPARSE_CONFIG) through the guarded connection layer.
# Preferred interface: `riskparse db-upgrade` / `riskparse db-current`.
[alembic]
script_location = src/riskparse/db/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
